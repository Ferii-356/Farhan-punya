workflows:
  ios-release:
    name: Build Unsigned iOS Release IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter packages
        script: |
          if [ -d "pkl_attendance_app" ]; then
            cd pkl_attendance_app
          fi
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          if [ -d "pkl_attendance_app" ]; then
            cd pkl_attendance_app
          fi
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          flutter build ios --config-only
          cd ios && pod install
      - name: Build Unsigned iOS IPA
        script: |
          if [ -d "pkl_attendance_app" ]; then
            cd pkl_attendance_app
          fi
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload
    artifacts:
      - "*.ipa"
      - "**/*.ipa"
