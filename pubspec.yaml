name: pkl_attendance_app
description: Aplikasi absensi PKL dengan verifikasi lokasi dan foto
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # firebase_storage: ^12.3.4 # Digantikan oleh Supabase Storage

  # Storage alternatif (Supabase - Gratis tanpa kartu kredit)
  supabase_flutter: ^2.8.0

  # Kamera & lokasi
  camera: ^0.11.0+2
  geolocator: ^13.0.1


  # Keamanan / anti-spoofing
  flutter_jailbreak_detection_plus: ^1.10.7

  # Image processing
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4

  # State management ringan
  provider: ^6.1.2

  # Util
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

